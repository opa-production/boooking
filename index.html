<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ardena Bookings — Rent a car in Kenya</title>
    <meta
      name="description"
      content="Rent a car in Kenya with Ardena. Browse verified hosts, book by the day, and pay securely — with insurance included and 24/7 support."
    />
    <meta name="theme-color" content="#f4f5f7" />
    <link rel="icon" type="image/png" href="/src/assets/blue.png" />
    <link rel="apple-touch-icon" href="/src/assets/logo.png" />

    <!-- Native app association: maps this site to the Ardena Android app
         (package com.ardena.client) for link handling / app indexing. The
         in-app prompt itself is a custom banner (AppBanner) so both platforms
         get the same styled "continue in app" nudge. -->
    <link rel="alternate" href="android-app://com.ardena.client/https/booking.ardena.co.ke/" />

    <!-- Open Graph / social share -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ardena Bookings" />
    <meta property="og:title" content="Ardena Bookings — Rent a car in Kenya" />
    <meta
      property="og:description"
      content="Browse verified hosts, book by the day, and pay securely — insurance included and 24/7 support."
    />
    <!-- Absolute URL, and served from public/ so the filename survives the
         build unhashed — scrapers (WhatsApp, Facebook, Slack) can't resolve a
         relative og:image and won't follow a name that changes each deploy. -->
    <meta property="og:image" content="https://booking.ardena.co.ke/og-image.png" />
    <meta property="og:image:width" content="1553" />
    <meta property="og:image:height" content="1150" />
    <meta property="og:image:alt" content="Ardena" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
